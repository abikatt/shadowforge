name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag
        id: tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a release tag; expected v<major>.<minor>.<patch>, e.g. v1.0.0"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ShadowForge.slnx -c Release -warnaserror -p:Version=${{ steps.tag.outputs.version }}

      - name: Package
        env:
          Version: ${{ steps.tag.outputs.version }}
        run: |
          $manifest = "addon/io_shadowforge/blender_manifest.toml"
          $text = Get-Content $manifest -Raw
          $pattern = '(?m)^version = "[^"]*"'
          if ($text -notmatch $pattern) { throw "No version line found in $manifest" }
          $stamped = $text -replace $pattern, "version = `"$env:Version`""
          Set-Content $manifest $stamped -NoNewline
          ./addon/build.ps1
          $out = "release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item addon/dist/publish/sforge.exe "$out/sforge-${{ github.ref_name }}-win-x64.exe"
          Copy-Item addon/dist/io_shadowforge.zip "$out/io_shadowforge-${{ github.ref_name }}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @("--title", "${{ github.ref_name }}", "--generate-notes", "--verify-tag")
          if ("${{ steps.tag.outputs.prerelease }}" -eq "true") { $flags += "--prerelease" }
          gh release create "${{ github.ref_name }}" @flags (Get-ChildItem release).FullName
